{% extends "base.html" %}
{% block title %}Правила{% endblock %}
{% block content %}
<h1>Правила чата</h1>
<div class="panel">
  <form method="post" action="/rules">
    <label>Текст правил — Rich HTML (Bot API 10.1): &lt;b&gt;, &lt;i&gt;, &lt;a&gt;, &lt;blockquote&gt;, &lt;tg-spoiler&gt;, а также настоящие таблицы:
      &lt;table bordered striped&gt;&lt;tr&gt;&lt;th&gt;Нарушение&lt;/th&gt;&lt;th&gt;Наказание&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Спам&lt;/td&gt;&lt;td&gt;Мут&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;</label>
    <textarea name="text">{{ rules['text'] }}</textarea>
    <button type="submit">Сохранить и отправить в чат</button>
  </form>
  <p class="muted">После сохранения бот автоматически опубликует обновлённые правила в чате. Если Telegram не примет разметку, бот отправит текст без неё.</p>
</div>
{% endblock %}
